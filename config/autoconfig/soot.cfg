// Soot startup. The launcher copies this next to the engine; it loads app\boot.sys.mjs.
try {
  const root = Services.dirsvc.get("GreD", Components.interfaces.nsIFile).parent;
  const app = root.clone();
  app.append("app");
  Services.io.getProtocolHandler("resource").QueryInterface(Components.interfaces.nsIResProtocolHandler)
    .setSubstitution("soot", Services.io.newFileURI(app));
  ChromeUtils.importESModule("resource://soot/boot.sys.mjs").start();
} catch (e) {
  Components.utils.reportError(e);
}
